name: Check Instagram profiles

on:
  # new or changed handles get checked right after they're saved
  push:
    branches: [main]
    paths: ['public/handles.json']
  # "Check" buttons on the handles page
  workflow_dispatch:
    inputs:
      mode:
        description: 'new = unchecked handles only, all = every handle, or space-separated handles'
        default: new
  # weekly full pass catches handles that stopped working
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: write

concurrency:
  group: profiles
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check profiles
        run: |
          mode="${{ github.event.inputs.mode }}"
          if [ "${{ github.event_name }}" = "schedule" ] || [ "$mode" = "all" ]; then args="--all"
          elif [ -z "$mode" ] || [ "$mode" = "new" ]; then args=""
          else args="$mode"; fi
          node scripts/check-profiles.mjs $args
      - name: Commit results
        run: |
          git add public/profiles.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -m "Instagram profile check"
          # a handle save may have landed meanwhile
          git pull --rebase origin main
          git push
