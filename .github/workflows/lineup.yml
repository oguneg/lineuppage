name: Update lineup & deploy

on:
  push:
    branches: [main]
    # handle saves don't need a redeploy — the page reads handles.json straight from the repo
    paths-ignore: ['public/handles.json', 'public/profiles.json']
  workflow_dispatch:
  schedule:
    # Daily fetch for 10:00 Swedish time. Cron is UTC and GitHub often starts scheduled runs
    # late (worst on the hour), so run at :07, at 08:07 and 09:07 UTC — one of them is
    # after 10:00 in Sweden in both summer and winter. The page also re-fetches by itself
    # when it's opened after 10:00 and the lineup is older than that.
    - cron: '7 8 * * *'
    - cron: '7 9 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/fetch-lineup.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
